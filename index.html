<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4B1F7A">
<title>CRM TecnoShopSV</title>
<link rel="icon" href="https://catalogo.tecnoshopsv.com/icono-180.png">
<link rel="apple-touch-icon" href="https://catalogo.tecnoshopsv.com/icono-180.png">
<style>
  html,body{margin:0;height:100%;background:#F7F6FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #cargando{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#4B1F7A}
  #cargando img{width:72px;height:72px;border-radius:16px}
  .barra{width:140px;height:4px;border-radius:4px;background:#E8E3F0;overflow:hidden}
  .barra i{display:block;width:40%;height:100%;background:#FFC52E;animation:ir 1.1s ease-in-out infinite}
  @keyframes ir{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head>
<body>
<div id="cargando"><img src="https://catalogo.tecnoshopsv.com/icono-180.png" alt=""><b>CRM TecnoShopSV</b><div class="barra"><i></i></div></div>
<iframe id="crm" title="CRM TecnoShopSV" allow="camera; clipboard-write" src="https://script.google.com/macros/s/AKfycbw4LVB9cvL2KwWoXQZ4T2WCT8TDELl7NaKc1mzehOrqy5uUl4DEqRAPHYTzm4HYXvBv/exec"
  onload="document.getElementById('cargando').style.display='none'"></iframe>
</body>
</html>
